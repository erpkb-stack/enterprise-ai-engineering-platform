[project]
name = "aiecc-backend"
version = "1.0.0"
description = "AI Engineering Command Center (AIECC) - backend modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pgvector>=0.3",
  "httpx>=0.27",
  "redis>=5.0",
  "arq>=0.26",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "mcp>=1.9",
  "jinja2>=3.1",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "psutil>=6.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "jsonschema>=4.23",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "locust>=2.31",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "postgres: requires a running PostgreSQL (TEST_DATABASE_URL)",
  "ollama: requires a running Ollama server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "S311", "E501", "UP047", "ASYNC109"]  # UP047: keep TypeVar style; ASYNC109: deliberate timeout params

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "ASYNC"]
"app/codereview/*" = ["S"]

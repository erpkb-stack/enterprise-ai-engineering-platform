name: aiecc

x-backend-env: &backend-env
  AIECC_ENV: ${AIECC_ENV:-local}
  AIECC_DATABASE_URL: postgresql+asyncpg://aiecc:${POSTGRES_PASSWORD:-aiecc}@postgres:5432/aiecc
  AIECC_REDIS_URL: redis://redis:6379/0
  AIECC_OLLAMA_BASE_URL: ${AIECC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  AIECC_JOBS_MODE: arq
  AIECC_OTEL_ENABLED: ${AIECC_OTEL_ENABLED:-true}
  AIECC_OTEL_ENDPOINT: http://otel-collector:4318
  AIECC_CORS_ORIGINS: ${AIECC_CORS_ORIGINS:-http://localhost:5180,http://localhost:8180}
  AIECC_JWT_SECRET: ${AIECC_JWT_SECRET:-dev-only-change-me-dev-only-change-me-0123456789}
  AIECC_ENCRYPTION_KEY: ${AIECC_ENCRYPTION_KEY:-ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=}
  AIECC_EMBEDDING_PROVIDER: ${AIECC_EMBEDDING_PROVIDER:-mock}
  AIECC_EMBEDDING_MODEL: ${AIECC_EMBEDDING_MODEL:-hash-embed-768}
  AIECC_OPENAI_API_KEY: ${AIECC_OPENAI_API_KEY:-}
  AIECC_ANTHROPIC_API_KEY: ${AIECC_ANTHROPIC_API_KEY:-}
  AIECC_GEMINI_API_KEY: ${AIECC_GEMINI_API_KEY:-}
  AIECC_NVIDIA_NIM_API_KEY: ${AIECC_NVIDIA_NIM_API_KEY:-}
  AIECC_SEED_DEMO_DATA: ${AIECC_SEED_DEMO_DATA:-true}
  AIECC_DEMO_PASSWORD: ${AIECC_DEMO_PASSWORD:-Aiecc!Demo2026}
  AIECC_RATE_LIMIT_PER_MINUTE: ${AIECC_RATE_LIMIT_PER_MINUTE:-600}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiecc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiecc}
      POSTGRES_DB: aiecc
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiecc -d aiecc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    profiles: ["full", "app"]
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers 1 --timeout-graceful-shutdown 20"]
    ports: ["8100:8100"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 10s
      retries: 12
    stop_grace_period: 30s

  worker:
    build: ./backend
    profiles: ["full", "app"]
    environment: *backend-env
    command: ["arq", "app.worker.WorkerSettings"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend: {condition: service_healthy}

  frontend:
    build: ./frontend
    ports: ["8180:80"]
    profiles: ["full", "app"]
    depends_on:
      backend: {condition: service_healthy}

  otel-collector:
    profiles: ["full", "observability"]
    image: otel/opentelemetry-collector-contrib:0.154.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infrastructure/monitoring/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    profiles: ["full", "observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9190:9090"]
    depends_on: [backend]

  grafana:
    profiles: ["full", "observability"]
    image: grafana/grafana:12.3.9
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3190:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:

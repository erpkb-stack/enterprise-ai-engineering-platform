# Production / public-demo override for a single VPS (Hostinger KVM, any Docker host).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production --profile app up -d --build
# Differences from local:
#   * only Caddy is reachable from the internet (80/443, automatic Let's Encrypt HTTPS)
#   * Postgres, Redis, API, Prometheus and Grafana are NOT published on host ports
#   * real secrets come from .env.production (generated by deploy/hostinger/deploy.sh)
#   * the API trusts X-Forwarded-For from the internal proxy chain (correct client IPs for rate limiting & audit)
#   * restart policies + log rotation
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    <<: *restart
    ports: !reset []

  redis:
    <<: *restart
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]

  backend:
    <<: *restart
    ports: !reset []
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers 1 --proxy-headers --forwarded-allow-ips='*' --timeout-graceful-shutdown 20 --no-access-log"]
    extra_hosts: !reset []

  worker:
    <<: *restart
    extra_hosts: !reset []

  frontend:
    <<: *restart
    ports: !reset []

  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    profiles: ["full", "app"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      AIECC_DOMAIN: ${AIECC_DOMAIN:?set AIECC_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/groundwire-site:/srv/groundwire:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, contact]

  contact:
    # groundwire.tech contact form -> company mailbox via Hostinger SMTP (internal only; Caddy routes /api/contact)
    <<: *restart
    build: ./deploy/groundwire-contact
    profiles: ["full", "app"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-contact@groundwire.tech}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_TO: ${CONTACT_TO:-contact@groundwire.tech}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  otel-collector:
    <<: *restart
    ports: !reset []

  prometheus:
    <<: *restart
    ports: !reset []

  grafana:
    <<: *restart
    # reachable only through an SSH tunnel: ssh -L 3190:localhost:3190 root@<vps>  (bound to loopback)
    ports: !override ["127.0.0.1:3190:3000"]

volumes:
  caddy_data:
  caddy_config:
